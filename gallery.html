<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gallery | Hotel Rentals</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
    />

    <link rel="stylesheet" href="./css/style.css" />

    <link rel="stylesheet" href="./css/owl.carousel.min.css" />
    <link rel="stylesheet" href="./css/owl.theme.default.min.css" />

    <!-- Head -->
    <link
      href="https://cdn.jsdelivr.net/npm/glightbox/dist/css/glightbox.min.css"
      rel="stylesheet"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />

    <!-- Choices.js CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css"
    />
  </head>

  <body>
    <nav class="navbar navbar-expand-lg navbar-custom">
      <div class="container">
        <a class="navbar-brand" href="./index.html">
          <img src="./images/rental-logo.webp" alt="" />
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div
          class="collapse navbar-collapse justify-content-end"
          id="navbarNav"
        >
          <ul class="navbar-nav nav-menu-list">
            <li class="nav-item">
              <a class="nav-link" href="./contact.html">Contact </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="./gallery.html">Gallery</a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="#"
                ><i class="fas fa-comment icon"></i
              ></a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="https://facebook.com" target="_blank">
                <i class="bi bi-facebook fs-5"></i>
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="https://twitter.com" target="_blank">
                <i class="bi bi-twitter-x fs-5"></i>
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="https://instagram.com" target="_blank">
                <i class="bi bi-instagram fs-5"></i>
              </a>
            </li>

            <li class="nav-item">
              <a
                href="https://www.google.com/maps/dir/?api=1&destination=6.841767,3.613209"
                target="_blank"
                class="btn nav-link btn-sign text-white px-3"
                role="button"
              >
                <i class="bi bi-geo-alt-fill me-1"></i> Drive to Location
              </a>
            </li>
          </ul>
        </div>
      </div>

      <!-- Pointer Animation Icon -->
      <div id="pointer-icon" class="pointer-animation">
        <i class="bi bi-arrow-up"></i>
      </div>
    </nav>

    <!-- GALLERY SECTION -->
    <section class="position-relative">
      <div class="rental-banner">
        <div class="container">
          <h1 class="rental-banner-title">Gallery</h1>
          <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
              <li class="breadcrumb-item"><a href="#">Home</a></li>
              <li class="breadcrumb-item active" aria-current="page">
                Gallery
              </li>
            </ol>
          </nav>
        </div>
      </div>
    </section>

    <section class="gallery-section">
      <div class="container">
        <div class="text-center">
          <h2>Our Gallery</h2>
        </div>
        <ul
          class="nav nav-tabs justify-content-center mb-4 mt-5"
          id="galleryTabs"
          role="tablist"
        >
          <li class="nav-item" role="presentation">
            <button
              class="nav-link active"
              id="images-tab"
              data-bs-toggle="tab"
              data-bs-target="#images"
              type="button"
              role="tab"
              aria-controls="images"
              aria-selected="true"
            >
              Images
            </button>
          </li>
          <li class="nav-item" role="presentation">
            <button
              class="nav-link"
              id="videos-tab"
              data-bs-toggle="tab"
              data-bs-target="#videos"
              type="button"
              role="tab"
              aria-controls="videos"
              aria-selected="false"
            >
              Videos
            </button>
          </li>
        </ul>

        <div class="tab-content" id="galleryContent">
          <div
            class="tab-pane fade show active"
            id="images"
            role="tabpanel"
            aria-labelledby="images-tab"
          >
            <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-4">
              <div class="col">
                <div
                  class="gallery-item"
                  data-bs-toggle="modal"
                  data-bs-target="#imageModal"
                  data-image="./images/banner-1.jpeg"
                  data-title="The Zenith Residences "
                >
                  <img src="./images/banner-1.jpeg" alt="Image 1" />
                </div>
              </div>
              <div class="col">
                <div
                  class="gallery-item"
                  data-bs-toggle="modal"
                  data-bs-target="#imageModal"
                  data-image="./images/banner-2.jpeg"
                  data-title="Aura Apartments"
                >
                  <img src="./images/banner-2.jpeg" alt="Image 2" />
                </div>
              </div>
              <div class="col">
                <div
                  class="gallery-item"
                  data-bs-toggle="modal"
                  data-bs-target="#imageModal"
                  data-image="./images/banner-4.jpeg"
                  data-title="Nexus Living"
                >
                  <img src="./images/banner-3.jpeg" alt="Image 3" />
                </div>
              </div>
              <div class="col">
                <div
                  class="gallery-item"
                  data-bs-toggle="modal"
                  data-bs-target="#imageModal"
                  data-image="./images/banner-4.jpeg"
                  data-title="Emberstone Lofts"
                >
                  <img src="./images/banner-4.jpeg" alt="Image 4" />
                </div>
              </div>
              <div class="col">
                <div
                  class="gallery-item"
                  data-bs-toggle="modal"
                  data-bs-target="#imageModal"
                  data-image="./images/banner-6.jpeg"
                  data-title="Veridian Suites"
                >
                  <img src="./images/banner-5.jpeg" alt="Image 6" />
                </div>
              </div>
              <div class="col">
                <div
                  class="gallery-item"
                  data-bs-toggle="modal"
                  data-bs-target="#imageModal"
                  data-image="./images/banner-6.jpeg"
                  data-title="The Obsidian Tower"
                >
                  <img src="./images/banner-6.jpeg" alt="Image 6" />
                </div>
              </div>
            </div>
          </div>
          <div
            class="tab-pane fade"
            id="videos"
            role="tabpanel"
            aria-labelledby="videos-tab"
          >
            <div class="row row-cols-1 row-cols-sm-2 g-4">
              <div class="col">
                <div class="gallery-item video-container">
                  <iframe
                    src="https://www.youtube.com/embed/jhwlckLGlG4"
                    title="Video 1"
                    frameborder="0"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    allowfullscreen
                  ></iframe>
                </div>
              </div>
              <div class="col">
                <div class="gallery-item video-container">
                  <iframe
                    src="https://www.youtube.com/embed/jhwlckLGlG4"
                    title="Video 1"
                    frameborder="0"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    allowfullscreen
                  ></iframe>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div
        class="modal fade"
        id="imageModal"
        tabindex="-1"
        aria-labelledby="imageModalLabel"
        aria-hidden="true"
      >
        <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title" id="imageModalLabel"></h5>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
                aria-label="Close"
              ></button>
            </div>
            <div class="modal-body">
              <img src="" class="img-fluid" alt="Large Image" />
            </div>
          </div>
        </div>
      </div>
    </section>

    <script src="./js/jquery.min.js"></script>
    <script src="./js/owl.carousel.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/glightbox/dist/js/glightbox.min.js"></script>

    <!-- Choices.js JS -->
    <script src="https://cdn.jsdelivr.net/npm/choices.js/public/assets/scripts/choices.min.js"></script>

    <script src="./js/script.js"></script>
  </body>
</html>
